services:
  backend:
    image: ${IMAGE_BACKEND:-actividad5-jpa:latest}
    build:
      context: ./actividad5-jpa
      target: runtime
    container_name: actividad5-backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_USERNAME=estudiante
      - DB_PASSWORD=estudiante
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:18.3-alpine3.23
    environment:
      POSTGRES_DB: dwsc
      POSTGRES_USER: estudiante
      POSTGRES_PASSWORD: estudiante
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estudiante -d dwsc"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:

