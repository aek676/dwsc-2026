name: Build and Push Docker Images

on:
  push:
    branches: [main]
    paths:
      - 'actividad7/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push eureka-server
        run: |
          cd actividad7/eureka-server
          ./mvnw spring-boot:build-image -Dspring-boot.build-image.imageName=ghcr.io/aek676/eureka-server:${{ github.sha }} -DskipTests
          docker tag ghcr.io/aek676/eureka-server:${{ github.sha }} ghcr.io/aek676/eureka-server:latest
          docker push ghcr.io/aek676/eureka-server:${{ github.sha }}
          docker push ghcr.io/aek676/eureka-server:latest

      - name: Build and push omdb-service
        run: |
          cd actividad7/omdb-service
          ./mvnw spring-boot:build-image -Dspring-boot.build-image.imageName=ghcr.io/aek676/omdb-service:${{ github.sha }} -DskipTests
          docker tag ghcr.io/aek676/omdb-service:${{ github.sha }} ghcr.io/aek676/omdb-service:latest
          docker push ghcr.io/aek676/omdb-service:${{ github.sha }}
          docker push ghcr.io/aek676/omdb-service:latest

      - name: Build and push tmdb-service
        run: |
          cd actividad7/tmdb-service
          ./mvnw spring-boot:build-image -Dspring-boot.build-image.imageName=ghcr.io/aek676/tmdb-service:${{ github.sha }} -DskipTests
          docker tag ghcr.io/aek676/tmdb-service:${{ github.sha }} ghcr.io/aek676/tmdb-service:latest
          docker push ghcr.io/aek676/tmdb-service:${{ github.sha }}
          docker push ghcr.io/aek676/tmdb-service:latest

      - name: Build and push movies-manager
        run: |
          cd actividad7/movies-manager
          ./mvnw spring-boot:build-image -Dspring-boot.build-image.imageName=ghcr.io/aek676/movies-manager:${{ github.sha }} -DskipTests
          docker tag ghcr.io/aek676/movies-manager:${{ github.sha }} ghcr.io/aek676/movies-manager:latest
          docker push ghcr.io/aek676/movies-manager:${{ github.sha }}
          docker push ghcr.io/aek676/movies-manager:latest

      - name: Build and push gateway
        run: |
          cd actividad7/gateway
          ./mvnw spring-boot:build-image -Dspring-boot.build-image.imageName=ghcr.io/aek676/gateway:${{ github.sha }} -DskipTests
          docker tag ghcr.io/aek676/gateway:${{ github.sha }} ghcr.io/aek676/gateway:latest
          docker push ghcr.io/aek676/gateway:${{ github.sha }}
          docker push ghcr.io/aek676/gateway:latest