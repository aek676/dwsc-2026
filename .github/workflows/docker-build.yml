name: Build and Push Docker Images

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5
        with:
          path: actividad7

      - name: Set up Docker BuildX
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push eureka-server
        uses: docker/build-push-action@v7
        with:
          context: ./actividad7/eureka-server
          push: true
          tags: |
            ghcr.io/aek676/eureka-server:${{ github.sha }}
            ghcr.io/aek676/eureka-server:latest

      - name: Build and push omdb-service
        uses: docker/build-push-action@v7
        with:
          context: ./actividad7/omdb-service
          push: true
          tags: |
            ghcr.io/aek676/omdb-service:${{ github.sha }}
            ghcr.io/aek676/omdb-service:latest

      - name: Build and push tmdb-service
        uses: docker/build-push-action@v7
        with:
          context: ./actividad7/tmdb-service
          push: true
          tags: |
            ghcr.io/aek676/tmdb-service:${{ github.sha }}
            ghcr.io/aek676/tmdb-service:latest

      - name: Build and push movies-manager
        uses: docker/build-push-action@v7
        with:
          context: ./actividad7/movies-manager
          push: true
          tags: |
            ghcr.io/aek676/movies-manager:${{ github.sha }}
            ghcr.io/aek676/movies-manager:latest

      - name: Build and push gateway
        uses: docker/build-push-action@v7
        with:
          context: ./actividad7/gateway
          push: true
          tags: |
            ghcr.io/aek676/gateway:${{ github.sha }}
            ghcr.io/aek676/gateway:latest

