spring:
  application:
    name: movies-manager

server:
  port: ${PORT:${SERVER_PORT:0}}

eureka:
  instance:
    hostname: localhost
    instance-id: ${eureka.instance.hostname}:${spring.application.name}:${spring.application.name:${random.value}}
  client:
    service-url:
      defaultZone: http://localhost:8761

management:
  endpoints:
    web:
      exposure:
        include: health,info

info:
  application:
    name: ${spring.application.name}
    description: This application checks movies before insertion
    version: "@project.version@"