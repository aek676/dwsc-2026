spring:
  application:
    name: sample-client-verb

server:
  port: ${PORT:${SERVER_PORT:0}}

eureka:
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${random.uuid}
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health, info, refresh

info:
  application:
    name: ${spring.application.name}
    description: This application returns a random verb
    version: "@project.version@"

words: accept(s), follow(s)

---
spring:
  config:
    activate:
      on-profile: positive-verb

words: love(s), like(s), adore(s)

---
spring:
  config:
    activate:
      on-profile: negative-verb

words: hate(s), detest(s)
