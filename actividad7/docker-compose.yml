services:
  eureka-server:
    image: eureka.server:0.0.1-SNAPSHOT
    container_name: eureka-server
    ports:
      - "8761:8761"

  omdb-service:
    image: eureka.client.omdb:0.0.1-SNAPSHOT
    container_name: omdb-service
    ports:
      - "8085:8085"
    environment:
      - SERVER_PORT=8085
      - EUREKA_INSTANCE_HOSTNAME=omdb-service
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - OMDB_API_KEY=${OMDB_API_KEY}
    depends_on:
      - eureka-server

  tmdb-service:
    image: eureka.client.tmdb:0.0.1-SNAPSHOT
    container_name: tmdb-service
    ports:
      - "8086:8086"
    environment:
      - SERVER_PORT=8086
      - EUREKA_INSTANCE_HOSTNAME=tmdb-service
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - TMDB_API_KEY=${TMDB_API_KEY}
    depends_on:
      - eureka-server
