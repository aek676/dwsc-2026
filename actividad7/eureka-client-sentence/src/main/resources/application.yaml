spring:
  application:
    name: sentence

server:
  port: ${PORT:${SERVER_PORT:0}}

eureka:
  instance:
    hostname: localhost
    instance-id: ${eureka.instance.hostname}:${spring.application.name}:${spring.application.instance_id:${random.value}}

  client:
    service-url:
      default-zone: http://localhost:8761/eureka

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health, info

info:
  application:
    name: ${spring.applicacion.name}
    description: This applicacion returns a random sentence
    version: "@project.version@"
